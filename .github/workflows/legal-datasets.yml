name: Prepare legal AI dataset samples

on:
  workflow_dispatch:
    inputs:
      rows_per_dataset:
        description: "Maximum sample rows per dataset"
        required: true
        default: "10"
        type: choice
        options:
          - "5"
          - "10"
          - "25"
  push:
    paths:
      - "datasets/manifest.json"
      - "scripts/download_legal_datasets.py"
      - ".github/workflows/legal-datasets.yml"

permissions:
  contents: read

concurrency:
  group: legal-dataset-samples
  cancel-in-progress: false

jobs:
  download-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dataset client
        run: python -m pip install --upgrade pip datasets pdfplumber

      - name: Download bounded samples on GitHub runner
        env:
          ROWS_PER_DATASET: ${{ inputs.rows_per_dataset || '10' }}
          MAX_FIELD_CHARS: "3000"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python scripts/download_legal_datasets.py

      - name: Upload generated samples and source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legal-ai-dataset-samples
          path: datasets/generated/
          if-no-files-found: error
          retention-days: 14
